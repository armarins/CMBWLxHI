# ---------------------------------------------------------------------------
# Sampler
# ---------------------------------------------------------------------------
sampler:
  mcmc:
    Rminus1_stop: 0.005  # Gelman-Rubin R-1 on means
    Rminus1_single_split: 40 # Default is 4
    Rminus1_cl_stop: 0.2 # Default is 0.2 # Gelman-Rubin R-1 on std deviations
    Rminus1_cl_level: 0.95 # Default is 0.95
    burn_in: 30
    proposal_scale: 2.4 # Default, adjust if acceptance rate is too low/high
    learn_proposal: True
    learn_proposal_Rminus1_max: 2.0 # Default
    learn_proposal_Rminus1_max_early: 30.0 # Default
    learn_proposal_Rminus1_min: 0.0 # Default
    max_tries: .inf # Default is 100 * n_params_vary
    max_samples: .inf #50000 # Set a limit for testing
    #seed: 42 # PS: in parallel runs, only works until to the first proposer covmat update.
    measure_speeds: True
  #emcee:
    #nwalkers: 100 # Number of walkers (e.g., > 2 * N_dims_varying)
    #nsteps: 5000 # Total number of steps per walker (or use stopping criteria)
    #initial_ball_scale: 0.01 # Scale for initial walker ball
    #learn_proposal: True # If Cobaya should manage proposal learning (usually good)
    #Other emcee settings or Cobaya's mcmc-like stopping criteria (Rminus1_stop etc.)
    #Cobaya's MCMC settings like burn_in, Rminus1_stop often apply here too
    #Rminus1_stop: 0.01
    #burn_in: 1000 # Steps to discard as burn-in
    #max_tries: 5000    
#run:
#  max_parallel: 20
#######################################################
#
# TIPS
#
#######################################################
# cobaya-install camb: to install CAMB by COBAYA and so
# not been necessary to inform where is the CAMB or 
# 2comment packages_path
#
# to run YAML for COBAYA there is two main ways:
# if your script is in: /Users/alessandromarins/Programmation/LSSxHI-CODES/forecast
# $ export PYTHONPATH=/Users/alessandromarins/Programmation/LSSxHI-CODES/forecast:$PYTHONPATH
# $ cobaya-run [filename].yaml
#
# or, using directly
#
# $ PYTHONPATH=$PYTHONPATH:/Users/alessandromarins/Programmation/LSSxHI-CODES/#forecast cobaya-run [filename].yaml
#
#
# The number of different redshift requested from CAMB to interpolate to should be 
#   np.unique(num_z_1+num_z_2+num_z_3).size<=256
# for 3 non-overlap z-range, num_z_i=80
# for 4 non-overlap z-range, num_z_i=63
###########
# HI MODEL
###########
#    model [str]: Omega_HI,bias_HI model to be used.
#           - Jiajun-hod (Zhang et al 2022)
#           - Jiajun-ham (Zhang et al 2022)
#           - padmanabhan (Padmanabhan 2015)
#           - cunnington (Cunnington 2019)
#           - bull2015 (P. Bull 2015)
#           - crighton (I Carucci 2020)
#           - 'fixed','cte','const' or 'constant': must provide OHI and/or bHI
#              if OHI is None, 
#                  OHI=[4.86e-4, 4.86e-4, 4.86e-4,...]
#              if bHI is None,
#                  bHI=[1.00e-0, 1.00e-0, 1.00e-0,...]
#              if OHI (bHI) is int or float, 
#                  OHI=[OHI, OHI, OHI,...]
#                 (bHI=[bHI, bHI, bHI,...])
#              if OHI (bHI) is an array, it should be OHI.size==z.size and 
#                  OHI = [OHI[0], OHI[1], OHI[2], ..., OHI[z.size-1]]
#                 (bHI = [bHI[0], bHI[1], bHI[2], ..., bHI[z.size-1]])


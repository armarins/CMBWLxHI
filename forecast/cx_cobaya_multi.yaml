# ---------------------------------------------------------------------------
# Theory Computations (CAMB)
# ---------------------------------------------------------------------------
theory:
  camb:
    #path: /opt/anaconda3/envs/myconda3.10/lib/python3.10/site-packages/camb
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 0.5 
      lSampleBoost: 0.5
      WantTransfer: True 
      WantCls: False
      kmax: 100
      dark_energy_model: fluid
      wa: 0
      # num_redshifts: 50 # Number of redshifts for CAMB's internal Pk grid
      # kmax: 50.0 # kmax for CAMB's Pk grid (Mpc^-1). Ensure it's high enough.

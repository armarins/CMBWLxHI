theory:
  camb:
    extra_args:
      halofit_version: mead2020
      redshifts: numpy.logspace(numpy.log10(1e-10),numpy.log10(1150), 150)
      kmax: 100.0
      omch2: 0.122
      npoints: 100000000
likelihood:
  cx_likelihood.CXLikelihood:
    data_file_h5: input/cl_gcLSSTxLOWZ_4x19_40_0001_delell20.h5
    params_aps_file: input/generating_APS_theory.yaml
    nside: 256
    del_l: 20
    lmin: 30
    lmax: 400
    hbin: 19
    num_z: 100
params:
  H0:
    prior:
      min: 60
      max: 80
    ref: 67.3
    proposal: 0.5
    latex: H_0
  ombh2:
    prior:
      min: 0.02
      max: 0.025
    ref: 0.0223
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  logA:
    prior:
      min: 2.5
      max: 3.5
    ref: 3.05
    proposal: 0.01
    latex: \log(10^{10} A_\mathrm{s})
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  ns:
    prior:
      min: 0.9
      max: 1.1
    ref: 0.965
    proposal: 0.004
    latex: n_s
  mnu: 0.06
  tf:
    prior:
      min: 0.8
      max: 1.2
    ref: 1.0
    proposal: 0.01
    latex: t_f
sampler:
  mcmc:
    Rminus1_stop: 0.04
    burn_in: 100
    max_samples: 5000
    learn_proposal: true
packages_path: /data2/LSSxHI-CODES/forecast
output: cx_mcmc_run_v1

likelihood:
  matter_power_spectrum:
    external: true
params:
  H0:
    latex: \mathrm{H}_0
    prior:
      dist: uniform
      max: 85
      min: 60
    proposal: 1
    ref: 67.5
  ombh2:
    latex: \Omega_\mathrm{b}h^2
    prior:
      dist: uniform
      max: 0.04
      min: 0.01
    proposal: 0.005
    ref: 0.022
  tf:
    latex: \mathrm{Tf}
    prior:
      dist: uniform
      max: 2.0
      min: 0.5
    proposal: 0.1
    ref: 1.2
sampler:
  mcmc:
    Rminus1_stop: 0.01
    Rminus1_single_split: 40
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    burn_in: 10
    proposal_scale: 2.4
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_tries: .inf
    max_samples: .inf
    seed: 42
    measure_speeds: true
run:
  max_parallel: 15
output: MH_3pars

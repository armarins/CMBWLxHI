theory:
  camb:
    extra_args:
      halofit_version: mead2020
      WantTransfer: true
likelihood:
  cx_likelihood_multi.CXLikelihood:
    omegahi_model: fixed
    include_gxhi_cl: true
    include_hixhi_cl: true
    include_gxg_cl: false
    aps_cx_yaml_1: input/generating_APS_theory_4x19.yaml
    data_cx_h5_1: input/cl_gcLSSTxLOWZ_4x19_40_0001_delell20.h5
    data_hi_h5_1: input/cl_LOWZxLOWZ_19x19_delell20.h5
    g_index_1: 4
    hi_index_1: 19
    num_z_1: 100
    lmin_1: 30
    lmax_1: 400
    del_l_1: 20
    aps_cx_yaml_2: input/generating_APS_theory_4x20.yaml
    data_cx_h5_2: input/cl_gcLSSTxLOWZ_4x20_40_0001_delell20.h5
    data_hi_h5_2: input/cl_LOWZxLOWZ_20x20_delell20.h5
    g_index_2: 4
    hi_index_2: 20
    num_z_2: 100
    lmin_2: 30
    lmax_2: 400
    del_l_2: 20
params:
  H0:
    prior:
      min: 40
      max: 90
    ref: 67
    proposal: 1.0
    latex: H_0
  w:
    prior:
      min: -2.0
      max: -0.3
    ref: -1.0
    proposal: 0.05
    latex: w
  ombh2:
    value: 0.0224
    latex: \Omega_b h^2
  omch2:
    prior:
      min: 0.01
      max: 0.6
    ref: 0.12
    proposal: 0.001
    latex: \Omega_c h^2
  omegahi:
    prior:
      min: 0.0001
      max: 0.0008
    ref: 0.0004
    proposal: 1.0e-05
    latex: \Omega_{hi} h
  ns:
    value: 0.965
    latex: n_s
  As:
    value: 2.0e-09
    latex: A_s
  mnu:
    value: 0.06
    latex: \Sigma m_\nu
  ax_1:
    prior:
      min: 0.1
      max: 2.0
    ref: 1.0
    proposal: 0.1
    latex: \alpha_{x,1}
  ax_2:
    prior:
      min: 0.1
      max: 2.0
    ref: 1.0
    proposal: 0.1
    latex: \alpha_{x,2}
  ah_1:
    prior:
      min: 0.0001
      max: 0.3
    ref: 0.03
    proposal: 0.005
    latex: \alpha_{hi,1}
  ah_2:
    prior:
      min: 0.0001
      max: 0.3
    ref: 0.03
    proposal: 0.005
    latex: \alpha_{hi,2}
sampler:
  mcmc:
    Rminus1_stop: 0.01
    Rminus1_single_split: 40
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    burn_in: 30
    proposal_scale: 2.4
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_tries: 1000
    max_samples: 50000
    seed: 42
    measure_speeds: true
output: MH_2datasets_cx_chi
derived:
  Omega_m:
    value: ({ombh2} + {omch2}) / (0.01*{H0})**2
    latex: \Omega_m

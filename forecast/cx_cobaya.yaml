##############################################################################
# cx_cobaya.yaml
##############################################################################

packages_path:
  - /data2/LSSxHI-CODES/scripts   
  - /data2/LSSxHI-CODES/forecast 
output: output/MH_3pars_new
force: True

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
params:
  H0:
    prior: {min: 60, max: 80}
    ref: 67.36
    proposal: 1.
    latex: H_0

  ombh2:
    prior: {min: 0.020, max: 0.025}
    ref: 0.0224
    proposal: 0.0001
    latex: \Omega_b h^2

  tf_1:
    prior: {min: 0.1, max: 2.0}
    ref: 1.0
    proposal: 0.05
    latex: tf_1
    
  omch2: # cold-DM density today
    value: 0.119
  ns: # scalar spectral index
    value: 0.965
  As: # scalar amplitude
    value: 2e-9
  mnu: # total neutrino mass in eV
    value: 0.06  
# ---------------------------------------------------------------------------
# YOUR likelihood
# ---------------------------------------------------------------------------
likelihood:
  cx_likelihood.CXLikelihood:   
    data_1_h5: input/cl_gcLSSTxLOWZ_4x19_40_0001_delell20.h5
    aps_1_yaml: input/generating_APS_theory_4x19.yaml
    hi_1_index: 19
    num_z: 100
    lmin: 30
    lmax: 400
    del_l: 20
    nside: 256

# ---------------------------------------------------------------------------
# Sampler (unchanged)
# ---------------------------------------------------------------------------
sampler:
  mcmc:
    Rminus1_stop: 0.01
    Rminus1_single_split: 40
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    burn_in: 1000
    proposal_scale: 2.4
    learn_proposal: True
    learn_proposal_Rminus1_max: 2.
    learn_proposal_Rminus1_max_early: 30.
    learn_proposal_Rminus1_min: 0.
    max_tries: +.inf
    max_samples: +.inf
    seed: 42
    measure_speeds: True

run:
  max_parallel: 20

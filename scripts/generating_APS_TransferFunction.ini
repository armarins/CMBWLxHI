##############################################################
#---------------------------------------------------------####
#--FGREMOVAL----------------------------------------------####
#- FG removal step and residual features -----------------####
#---------------------------------------------------------####
##############################################################

#######################################################
####################   GENERAL   ######################
#######################################################
[General]
verbose   = False
project   = LSST_bin{b}_40_0001
threshold = 1e-25
#load_simulations = True
#load has priority over generate
#######################################################
###################   SIMULATIONS   ###################
#######################################################
[Simulations]
nrealizations  = 500
nside          = 256
lmin           = 0
lmax           = -1
apply_mask     = False
#apply_namaster = True
#namaster_delell= 4
include_wn     = False
include_beam   = False
wn_sigma_pix   = 0.154
beam_fwhm      = 0.011635
numin          = 980
numax          = 1260
nbands         = 30
stokes         = I
unit           = mK
#varnames     = ['alm_hi', 'cl_hi_sim', 'cl_cross_sim']
#wn_sigma_pix: sensitivy per pixel
#beam_fwhm: full-width-half-maximum in radians
#if lmax > lmax from simulation, lmax_sim will be assumed
#varnames     = ['alm_hi', 'cl_hi_sim', 'cl_kappa_sim', 'cl_cross_sim', 'cl_kappa_uncorrelated','cross_correlation_coef', 'alm_kappa_sim']
#######################################################
####################   TF   ########################
#######################################################
[TransferFunction]
tf_hixhi      = True
tf_gxhi       = True
cross_g_bin   = 5
auto_hi_bins  = -1
cross_hi_bins = -1
#save_hi_plus_fg                  = True
#save_hi_plus_fg_smoothed         = True
#save_hi_plus_fg_plus_wn          = True
#save_hi_plus_fg_plus_wn_smoothed = True
save_simulated   = True
save_theoretical = True
save_hdf5        = True
save_txt         = False
#######################################################
####################   Algo   ########################
#######################################################
[Algorithm]
method     = ICA
wtransform = identity 
ns         = 4
#######################################################
####################   IN/OUT   #######################
#######################################################
[Inputs]
dirpath_chisel       = /data/AMARINS/chisel/scripts
dirpath_sims         = /data/AMARINS/LSSxHI-DATA/simulations/GCxHI/LSSTxLOWZ_40_0001/bin{b}
#/data/AMARINS/LSSxHI-DATA/simulations/LSST_bin{b}_40_0001/
dirpath_foregrounds  = /data/AMARINS/MAPS/FG256
dirpath_mask         = /data/AMARINS/MAPS/MASK
filename_foregrounds = FG_I_256_980mhz1260mhz_30bins_full_nonfrps_L0.fits
filename_mask        = 
#
filepath_field1 = /data/AMARINS/LSSxHI-DATA/theoretical/GCxHI/LSST_bin{b}_40_0001_HI_cl_LOWZ.txt
filepath_field2 = /data/AMARINS/LSSxHI-DATA/theoretical/GCxHI/LSST_bin{b}_40_0001_DENSITY_cl_LOWZ.txt
filepath_cross  = /data/AMARINS/LSSxHI-DATA/theoretical/GCxHI/LSST_bin{b}_40_0001_HIxDENSITY_cl_LOWZ.txt
#
[Outputs]
pathout = /data/AMARINS/LSSxHI-DATA/tfunction/LSST_40_0001

##############################################################
#---------------------------------------------------------####
#--generating Angular Power Spectrum----------------------####
#---------------------------------------------------------####
##############################################################

#######################################################
####################   GENERAL   ######################
#######################################################
[General]
verbose   = False
threshold = 1e-20
nprocs    = 1
#nprocs: number of processs to be used: if your CPU contains N cores available and you require
# M (>N), N is modified to M. If you set nprocs<0, nprocs=1.
#######################################################
####################   COSMOLOGY   ####################
#######################################################
[Cosmology]
# Data for CAMB 
H0    = 67.5
ombh2 = 0.022
omch2 = 0.122
ns    = 0.965 

#######################################################
####################   COSMOLOGY   ####################
#######################################################
[CAMB]
zmin_integration_camb   = 0.001
zmax_integration_camb   = 1150
zsteps_integration_camb = 150
kmax    = 100
minkh   = 0.0001
maxkh   = 1
npoints = 10000000
Pk_nonlinear = True
halofit_version = mead2020
#dark_energy_model='DarkEnergyPPF'
##
## Not implemented yet
load_Pk = False
path_to_Pk = 
path_to_hubble_z = 
path_to_comovel_dist_z = 
#######################################################
#######################   APS   #######################
#######################################################
[APS]
#Does not change field1 as hi #to be improved later, for any field1.
#field2: [cmbwl, shear, count]   #cmbwl=CMB kappa, shear=(jth-bin) galaxy shear 
field_1 = hi
field_2 = density
l_min = 0
l_max = 767
#binning_delta_l = 1 #not implemented yet
#lmax  must be chosen such that 3*nside
#boolean variables must not be handle in terminal command
generate_cl_field_1 = True
generate_cl_field_2 = True
generate_cl_cross   = True
pathout = /data/AMARINS/LSSxHI-DATA/theoretical/GCxHI
prefix  = LSSTY10_tomos70_bin0
suffix  = LOWZ
##
#For shear or count/clustering,
## EUCLID and LSST implemented
#######################################################
###################  Shear SURVEY   ###################
#######################################################
[SHEAR]
#survey: set which project you wanna based on 
#dataset: if you are assuming a fit modeling for a specific survey dataset
#parameters_set: to set the values for the fit modeling of redshift dist of galaxy lensing
#photometric_lkl: type of photometric likelihood used to turn the spec dist into photometric
#bin_to_use: 0,...,nch-1
#IA: intrinsic alignment
#slope_s_model 
# /data/AMARINS/CMBWLxHI-CODES/scripts/parameters/euclid_parameters.yaml
# /data/AMARINS/CMBWLxHI-CODES/scripts/parameters/lsst_desc_parameters.yaml
path_to_shear_params_file = /data/AMARINS/LSSxHI-CODES/scripts/parameters/lsst_desc_parameters.yaml
survey_shear  = LSST
dataset_shear = Y10
binning_shear = True
bin_to_use_shear      = 0
parameters_shear_set  = standard
photometric_shear_lkl = gaussian 
include_ia     = False
L_model        = eNLA
L_value        = 0
path_to_L_file = 
F_model        = eNLA
F_value        = 0
path_to_F_file = 
beta_IA        = 2.17
eta_IA         = -0.41
#Changing the yaml file
#None values will not change the standard value
nbins_shear = -1
sigmaz_shear = -1
#zbins_edges_shear =
#######################################################
###################  CLUSTERING SURVEY   ##############
#######################################################
[COUNT]
#COUNT: CLUSTERING, number density
#RSD:   Redshift Spatial Distortion
#MB:    Magnification Bias
#mu = <k,n>=cos(theta) in [-1,1]
#bias_model b(z): SQRT, FLAGSHIP, FLAGSHIP2022, READ, CONST
# if bias_model=CONST, bias_value is assumed
# if bias_model=READ, path_to_bias_file: path to a txt file with two colunms: z,b(z)
# L_model: (Admensional Characteristic Luminosity): eNLA, READ, CONST  #eNLA
# F_model: eNLA, NLA, CONST, READ, FIT
# /data/AMARINS/CMBWLxHI-CODES/scripts/parameters/euclid_parameters.yaml
# /data/AMARINS/CMBWLxHI-CODES/scripts/parameters/lsst_desc_parameters.yaml

load_dNdz = True
path_to_count_params_file = /data/AMARINS/LSSxHI-CODES/scripts/parameters/lsst_desc_parameters.yaml
survey_count    = LSST
dataset_count   = Y10
mode_count      = photometric
bias_model      = SQRT
bias_value      = 1
path_to_bias_file = 
binning_count = True
parameters_count_set  = standard
photometric_count_lkl = gaussian 
bin_to_use_count      = 0
include_rsd   = False
include_mb    = False
mu_rsd        = 0
slope_s_model = 
slope_s_value = 0
path_to_slope_s_file = 
#---Changing the yaml file---
#None values will not change the standard value
nbins_count = -1
sigmaz_count = -1
#zbins_edges_count =

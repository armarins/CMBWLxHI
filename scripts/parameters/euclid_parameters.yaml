#  EUCLID survey parameters
sky:
  full_sky: 41252.9612  # full sky in square degrees
  survey_sky: 15000 # requirement #Euclid: Mapping the geometry of the dark, table 3.1
  #survey_sky: 20000 # target #Euclid: Mapping the geometry of the dark, table 3.1  
  f_sky: 0.36361026126774143

lens_sample: # lens galaxy sample parameters
  "Y10": # year 10 lens sample parameters
    survey: 'EUCLID'
    data_release: 'Y10'
    field:  'lensing'
    z_min: 0.001 #survey
    z_max: 2.5  #survey
    zbin_min: 0.001  #field tomographic analysis
    zbin_max: 2.5     #field tomographic analysis
    zbin_edges: [1.000e-03, 4.180e-01, 5.600e-01,  6.780e-01, 7.890e-01, 9.000e-01, 1.019e+00, 1.155e+00, 1.324e+00, 1.576e+00, 2.500e+00]  
    nbins: 10
    alpha: 1.5
    beta: 2 #<-- verificar se n esta invertido beta e alpha
    z_m: 0.9
    z_0: 0.6363961030678927  #z_m/sqrt(2)
    c_b: 1
    c_0: 1
    sigma_b: 0.05
    sigma_0: 0.05
    z_b: 0.0
    z_o: 0.1
    f_out: 0.1    
    l_min: 10
    l_max: 1500 #1500(pessimistic)/5000(optimistic)    
    #n_gal: 40 #arcmin**-2 [target value] #Euclid: Mapping the geometry of the dark, table 3.2
    n_gal: 30 #arcmin**-2 [requirement value]  #Euclid: Mapping the geometry of the dark, table 3.2   
    f_sky: 0.36361026126774143    
    ellipticity: 0.26
  "FAKE": # year 10 lens sample parameters
    survey: 'EUCLID'
    data_release: 'Y10'
    field:  'lensing'
    z_min: 0.001 #survey
    z_max: 2.5  #survey
    zbin_min: 0.001  #field tomographic analysis
    zbin_max: 2.5     #field tomographic analysis
    zbin_edges: [1.000e-03, 2.790e-01, 5.560e-01, 8.340e-01, 1.112e+00, 1.389e+00, 1.667e+00, 1.945e+00, 2.222e+00, 2.500e+00]  
    nbins: 10
    alpha: 1.5
    beta: 2
    z_m: 0.9
    z_0: 0.6363961030678927  #z_m/sqrt(2)
    c_b: 1
    c_0: 1
    sigma_b: 0.05
    sigma_0: 0.05
    z_b: 0.0
    z_o: 0.1
    f_out: 0.1    
    l_min: 10
    l_max: 1500 #1500(pessimistic)/5000(optimistic)    
    #n_gal: 40 #arcmin**-2 [target value] #Euclid: Mapping the geometry of the dark, table 3.2
    n_gal: 30 #arcmin**-2 [requirement value]  #Euclid: Mapping the geometry of the dark, table 3.2   
    f_sky: 0.36361026126774143    
    ellipticity: 0.26
#######    
#Euclid Collaboration: L. Paganin et al.: Euclid preparation: 6×2pt analysis of Euclid’s spectro and photo data sets    (ECL_L)
#Euclid: Validation of the MontePython forecasting tools - Casas et al 
source_sample: # lens galaxy sample parameters
  photometric: # year 10 lens sample parameters
     "Y10":
        survey: 'EUCLID'
        data_release: 'Y10'
        field:  'density' 
        mode: 'photometric'
        z_min: 0.001 #survey
        z_max: 2.5   #survey
        zbin_min: 0.001  #field tomographic analysis
        zbin_max: 2.5    #field tomographic analysis
        zbin_edges: [1.000e-03, 4.180e-01, 5.600e-01,  6.780e-01, 7.890e-01, 9.000e-01, 1.019e+00, 1.155e+00, 1.324e+00, 1.576e+00, 2.500e+00]  
        nbins: 10
        bias_g: [1.100, 1.220, 1.272, 1.317, 1.358, 1.400, 1.445, 1.497, 1.565, 1.743]  #table2, [ECL_L]
        alpha: 1.5
        beta: 2
        z_m: 0.9
        z_0: 0.6363961030678927  #z_m/sqrt(2)
        c_b: 1
        c_0: 1
        sigma_b: 0.05 # requirement #Euclid: Mapping the geometry of the dark, table 3.3
        sigma_0: 0.05 # ''
        #sigma_b: 0.03 # target #Euclid: Mapping the geometry of the dark, table 3.3
        #sigma_0: 0.03 # ''        
        z_b: 0.0
        z_o: 0.1        
        f_out: 0.1  # requirement #Euclid: Mapping the geometry of the dark, table 3.3
        #f_out: 0.05  # target #Euclid: Mapping the geometry of the dark, table 3.3        
        n_gal: 30  # number density of galaxies per arcmin^2 # Euclid preparation - VII. 2020 # page 22
        C_IA: 0.0134  #IA: Intrinsic alignment
        beta_IA: 2.17 
        sigma_noise: 0.3
        l_min: 10
        l_max: 1500 #750(pessimistic)/1500(optimistic)
        f_sky: 0.36361026126774143            
        fwhm: 0.01666 #arcmin (1 arcsec
     "FAKE":
        survey: 'like-EUCLID'
        data_release: 'fake-Y10'
        field:  'density' 
        mode: 'photometric'
        z_min: 0.001 #survey
        z_max: 2.5   #survey
        zbin_min: 0.001  #field tomographic analysis
        zbin_max: 2.5    #field tomographic analysis
        zbin_edges: [1.000e-03, 2.790e-01, 5.560e-01, 8.340e-01, 1.112e+00, 1.389e+00, 1.667e+00, 1.945e+00, 2.222e+00, 2.500e+00]  
        nbins: 10
        alpha: 1.5
        beta: 2
        z_m: 0.9
        z_0: 0.6363961030678927  #z_m/sqrt(2)
        c_b: 1
        c_0: 1
        sigma_b: 0.03 # requirement #Euclid: Mapping the geometry of the dark, table 3.3
        sigma_0: 0.03 # ''
        z_b: 0.0
        z_o: 0.1        
        f_out: 0.05
        n_gal: 30  # number density of galaxies per arcmin^2 # Euclid preparation - VII. 2020 # page 22
        C_IA: 0.0134  #IA: Intrinsic alignment
        beta_IA: 2.17 
        sigma_noise: 0.3
        l_min: 10
        l_max: 1500 #750(pessimistic)/1500(optimistic)
        f_sky: 0.36361026126774143            
        fwhm: 0.01666 #arcmin (1 arcsec    
    
  spectroscopic:
     "Y10":
        survey: 'EUCLID'
        data_release: 'Y10'
        field:  'density'  
        mode: 'spectroscopic'        
        z_min: 0.90 #survey 
        z_max: 1.80 #survey
        zbin_min: 0.90   #field tomographic analysis
        zbin_max: 1.80  #''
        zbin_edges: [0.90, 1.10, 1.30, 1.50, 1.80]
        nbins: 4
        bias_g: [1.46, 1.61, 1.75, 1.90]       #calculate in the middle of the bin 
        alpha: 1.5
        beta: 2
        z_m: 0.9
        z_0: 0
        c_b: 1
        c_0: 1
        sigma_b: 0.001
        sigma_0: 0.001
        z_b: 0.0
        z_o: 0.0
        f_out: 0.00     
        n_gal: 5000  #deg**-2 # target      #Euclid: Mapping the geometry of the dark, table 3.4
        #n_gal: 3500 #deg**-2 # requirement #Euclid: Mapping the geometry of the dark, table 3.4        
        limit_flux:  3e-16 # [erg/cm2/s]    #Euclid: Mapping the geometry of the dark, table 3.4
        f_sky: 0.36361026126774143    
    
    
survey_redshift_range:
  z_start: 0.001  # start of the redshift interval
  z_stop:  2.5    # end of the redshift interval
  z_resolution: 300  # ?
